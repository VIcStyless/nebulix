# Mirror link for Nebulix: a tiny forwarder to the same server (no data, no secrets). See scripts/origin-forwarder.js
app = "nebulix-play"
primary_region = "cdg"

[build]
  dockerfile = "Dockerfile.forwarder"

[env]
  PORT = "8080"
  PUBLIC_HOST = "nebulix-play.fly.dev"
  TARGET_HOST = "nebulix.internal"
  TARGET_PORT = "3000"

[processes]
  app = "node scripts/origin-forwarder.js"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
