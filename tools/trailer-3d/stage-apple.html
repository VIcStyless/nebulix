<style>

</style></head><body><div id="stage"></div>

<script>

}
const S = {
  intro(t) { return `<div class="center" style="${textFx(t, 0.5, 2.2)}"><div class="small" style="font-size:54px;color:#f5f5f7;font-weight:600">Introducing</div></div>`; },
  logo(t, s) { const k = out(span(t, s.t0, s.t0 + 1.6)); const o = span(t, s.t1 - 0.5, s.t1); const shine = (span(t, s.t0 + 0.6, s.t1) * 160 - 30).toFixed(1);

  tag(t, s) { return `<div class="center"><div class="tag1" style="${textFx(t, s.t0 + 0.1, s.t1)}">Your entire digital world.</div><div class="tag1 grad" style="${textFx(t, s.t0 + 1.4, s.t1)};margin-top:10px">In one place.</div></div>`; },

  pair(t, s) { const e = out(span(t, s.t0, s.t0 + 1.4)); const o = span(t, s.t1 - 0.35, s.t1); const k = ease(span(t, s.t0, s.t1));
    const ct = (t - s.t0); return `<div class="head" style="${textFx(t, s.t0 + 0.15, s.t1)}"><h1>${s.h}</h1><p>${s.s}</p></div>` +

  speed(t, s) { const e = out(span(t, s.t0, s.t0 + 1.2)); const o = span(t, s.t1 - 0.35, s.t1); const n = (1 + 1.7 * out(span(t, s.t0 + 0.4, s.t0 + 2.2))).toFixed(1);
    return device(s.clip, (s.clipStart || 0) + (t - s.t0), 6, -22 + 10 * ease(span(t, s.t0, s.t1)), V ? -200 : -700, V ? 0 : 640, V ? 330 : -60, V ? 1 : 0.6, 0.85 * (1 - o)) +
      `<div class="center" style="${V ? 'justify-content:flex-start;padding:240px 70px 0' : 'align-items:flex-start;padding-left:200px'};opacity:${1 - o}"><div class="counter grad" style="opacity:${e};transform:translateY(${(1 - e) * 40}px)">${n}×</div><div style="${textFx(t, s.t0 + 0.6, s.t1)}"><h1 style="margin:10px 0 0;font-size:${V ? 88 : 84}px;font-weight:700;letter-spacing:-.035em">${s.h}</h1><p style="margin:14px 0 0;font-size:${V ? 36 : 34}px;color:#a1a1a6;font-weight:500">${s.s}</p></div></div>`; },
  ring(t, s) { const k = span(t, s.t0, s.t1); const e = out(span(t, s.t0, s.t0 + 1)); const o = span(t, s.t1 - 0.3, s.t1); const R = 980; const n = s.clips.length; const rot = -40 + 75 * ease(k);
    const panels = s.clips.map((c, i) => `<div class="panel" style="transform:rotateY(${(i * 360) / n}deg) translateZ(${R}px)">${img(frameAt(c[0], c[1] + (t - s.t0)))}</div>`).join('');
    const wi = Math.min(s.words.length - 1, Math.floor((t - s.t0) / ((s.t1 - s.t0) / s.words.length))); const wk = ((t - s.t0) % ((s.t1 - s.t0) / s.words.length)) / ((s.t1 - s.t0) / s.words.length);
    const wo = clamp(wk / 0.18) * (1 - clamp((wk - 0.82) / 0.18)); const ws = 1.12 - 0.12 * out(clamp(wk / 0.3));

  end(t, s) { const k = out(span(t, s.t0, s.t0 + 2.2)); const fade = span(t, s.t1 - 1.6, s.t1); const ry = 80 * (1 - k); const layers = 14;
    let logo = ''; for (let i = layers - 1; i >= 0; i--) logo += `<div style="position:absolute;inset:0;transform:translateZ(${-i * 2.2}px)">${LOGO.replace('FILL', i === 0 ? '#d4ff3f' : `rgb(${150 - i * 6},${190 - i * 7},${40})`)}</div>`;
    return `<div class="glow" style="opacity:${k * 0.8 * (1 - fade)}"></div><div class="center" style="opacity:${1 - fade}"><div class="logo3d" style="transform:rotateY(${ry}deg) rotateX(${8 * (1 - k)}deg) scale(${0.8 + 0.2 * k})">${logo}</div>
      <div style="${textFx(t, s.t0 + 0.8, s.t1 + 2)}"><div class="mega" style="font-size:${V ? 140 : 150}px">Nebulix ${V ? '<br>' : ''}<span class="grad">3.0</span></div></div>
      <div style="${textFx(t, s.t0 + 1.6, s.t1 + 2)}"><div class="small" style="margin-top:26px;${V ? 'padding:0 80px' : ''}">Available now. Free, in your browser.</div><div class="url grad">nebulix.fly.dev</div></div></div>`; },

  { kind: 'intro', t0: 0, t1: 2.2 },
  { kind: 'logo', t0: 2, t1: 6.2 },
  { kind: 'tag', t0: 6, t1: 10 },
  { kind: 'device', t0: 10, t1: 14, clip: 'home', clipStart: 0.9, h: 'Everything starts here.', s: 'Your apps, friends and games — one home.', motion: 'left' },
  { kind: 'device', t0: 14, t1: 18, clip: 'desktop', clipStart: 0.4, h: 'A whole desktop.', s: 'Apps, windows and workspaces. Right in your browser.', motion: 'right' },

  { kind: 'device', t0: 22, t1: 26, clip: 'cloudpc', clipStart: 5.5, h: 'A computer in the cloud.', s: 'Linux today. Windows, coming soon.', motion: 'right' },
  { kind: 'device', t0: 26, t1: 30, clip: 'docs', clipStart: 0, speed: 1.7, h: 'Write together. Live.', s: 'Documents, sheets and slides — co-edited in real time.', motion: 'left' },

  { kind: 'pair', t0: 34, t1: 38, clips: ['dragontiger', 'craps'], clipStarts: [0.2, 0.2], h: 'Play.', s: 'Arcade, tournaments and a casino — with play money only.' },
  { kind: 'speed', t0: 38, t1: 42, clip: 'photo', clipStart: 0.3, h: 'Built for speed.', s: 'Up to 2.7× faster image tools.<br>C++, compiled to WebAssembly.' },
  { kind: 'device', t0: 42, t1: 46, clip: 'admin', clipStart: 0.2, h: 'Run it all. At a glance.', s: 'Live metrics, health checks and people — for admins.', motion: 'left' },
  { kind: 'ring', t0: 46, t1: 50, clips: [['home', 2], ['desktop', 3], ['android', 3], ['docs', 5], ['gamemaker', 4], ['hub', 2], ['admin', 2], ['craps', 2], ['photo', 3], ['cloudpc', 9]], words: ['Create.', 'Play.', 'Share.'] },

</script></body></html>
