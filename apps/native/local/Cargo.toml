[package]
name = "nebulix-local"
description = "Native-only Nebulix features: hardware-accelerated QEMU virtual machines and the official Android Emulator on this computer"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
nebulix-core = { path = "../core" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
log.workspace = true
ureq = { version = "3", default-features = false, features = ["rustls"] }
roxmltree = "0.20"
zip = { version = "2", default-features = false, features = ["deflate"] }
sha1 = "0.10"
sha2 = "0.10"
