[package]
name = "nebulix-app"
description = "Nebulix native app"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[lib]
name = "nebulix_app"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "nebulix"
path = "src/main.rs"

[dependencies]
nebulix-core = { path = "../core" }
serde.workspace = true
serde_json.workspace = true
log.workspace = true
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[target.'cfg(not(target_os = "android"))'.dependencies]
slint = { version = "1.19", default-features = false, features = ["std", "compat-1-2", "accessibility", "backend-winit", "renderer-femtovg", "renderer-software"] }

[target.'cfg(any(target_os = "windows", target_os = "macos", target_os = "linux"))'.dependencies]
nebulix-local = { path = "../local" }
rfd = "0.15"
notify-rust = "4"
open = "5"

[target.'cfg(target_os = "android")'.dependencies]
slint = { version = "1.19", default-features = false, features = ["std", "compat-1-2", "backend-android-activity-06", "renderer-femtovg"] }

[dev-dependencies]
png = "0.17"

[build-dependencies]
slint-build = "1.19"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

# Android packaging (cargo-apk)
[package.metadata.android]
package = "dev.nebulix.app"
apk_name = "Nebulix"
build_targets = ["aarch64-linux-android", "x86_64-linux-android"]
resources = "android/res"

[package.metadata.android.sdk]
min_sdk_version = 26
target_sdk_version = 35

[package.metadata.android.application]
label = "Nebulix"
icon = "@mipmap/ic_launcher"
theme = "@android:style/Theme.DeviceDefault.NoActionBar"

[package.metadata.android.application.activity]
config_changes = "orientation|screenSize|keyboardHidden|keyboard|screenLayout|uiMode|density"
launch_mode = "singleTask"
orientation = "unspecified"

[[package.metadata.android.uses_permission]]
name = "android.permission.INTERNET"

[[package.metadata.android.uses_permission]]
name = "android.permission.POST_NOTIFICATIONS"

# Release signing comes from CI: CARGO_APK_RELEASE_KEYSTORE / CARGO_APK_RELEASE_KEYSTORE_PASSWORD (repository secrets).
