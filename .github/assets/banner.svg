<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" width="1280" height="420" role="img" aria-label="Nebulix — Todo tu internet, en un solo sitio">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0c0e"/>
      <stop offset="1" stop-color="#111318"/>
    </linearGradient>
    <radialGradient id="neb1" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#d4ff3f" stop-opacity=".30"/>
      <stop offset="1" stop-color="#d4ff3f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="neb2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#5eead4" stop-opacity=".26"/>
      <stop offset="1" stop-color="#5eead4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="neb3" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity=".22"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d9dde4"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity=".035"/>
    </pattern>
    <clipPath id="r"><rect width="1280" height="420" rx="24"/></clipPath>
  </defs>
  <g clip-path="url(#r)">
    <rect width="1280" height="420" fill="url(#bg)"/>
    <rect width="1280" height="420" fill="url(#grid)"/>
    <ellipse cx="1010" cy="120" rx="420" ry="260" fill="url(#neb1)"/>
    <ellipse cx="1180" cy="380" rx="360" ry="220" fill="url(#neb2)"/>
    <ellipse cx="760" cy="420" rx="380" ry="200" fill="url(#neb3)"/>
    <g fill="#ffffff">
      <circle cx="702" cy="64" r="1.4" opacity=".7"/><circle cx="1214" cy="48" r="1.2" opacity=".6"/>
      <circle cx="884" cy="300" r="1.1" opacity=".5"/><circle cx="1090" cy="250" r="1.6" opacity=".8"/>
      <circle cx="640" cy="350" r="1" opacity=".5"/><circle cx="1240" cy="190" r="1.3" opacity=".6"/>
      <circle cx="960" cy="40" r="1" opacity=".5"/><circle cx="790" cy="190" r="1.2" opacity=".5"/>
      <circle cx="1150" cy="330" r="1" opacity=".6"/><circle cx="560" cy="60" r="1" opacity=".4"/>
    </g>

    <!-- orbit with the app logo -->
    <g transform="translate(1010 210)">
      <ellipse rx="190" ry="72" fill="none" stroke="#d4ff3f" stroke-opacity=".28" stroke-width="1.5" transform="rotate(-14)"/>
      <ellipse rx="130" ry="48" fill="none" stroke="#5eead4" stroke-opacity=".30" stroke-width="1.5" transform="rotate(18)"/>
      <circle cx="176" cy="-58" r="6" fill="#5eead4"/>
      <circle cx="-120" cy="-30" r="4.5" fill="#d4ff3f"/>
      <circle cx="-150" cy="62" r="3" fill="#ffffff" opacity=".8"/>
      <g transform="translate(-72 -72) scale(2.25)">
        <rect x="2" y="2" width="60" height="60" rx="15" fill="#d4ff3f"/>
        <path d="M20 46V24.5a2.5 2.5 0 0 1 4.3-1.7L39.7 41.2a2.5 2.5 0 0 0 4.3-1.7V18" fill="none" stroke="#0b0c0e" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="20" cy="46" r="4.5" fill="#0b0c0e"/><circle cx="44" cy="18" r="4.5" fill="#0b0c0e"/>
      </g>
    </g>

    <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
      <g transform="translate(80 108)">
        <rect width="176" height="34" rx="17" fill="#d4ff3f" fill-opacity=".12" stroke="#d4ff3f" stroke-opacity=".45"/>
        <circle cx="20" cy="17" r="4" fill="#d4ff3f"/>
        <text x="34" y="22.5" font-size="15" font-weight="600" fill="#d4ff3f" letter-spacing=".5">VERSIÓN 13.8</text>
      </g>
      <text x="76" y="236" font-size="112" font-weight="800" fill="url(#title)" letter-spacing="-4">Nebulix</text>
      <text x="80" y="290" font-size="30" font-weight="500" fill="#c9ced6">Todo tu internet, en un solo sitio.</text>
      <text x="80" y="336" font-size="19" fill="#8a8f98">Navegador privado · Juegos · Comunidad · IA · Máquinas virtuales · Crear</text>
    </g>
