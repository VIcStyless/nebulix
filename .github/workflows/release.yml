# Builds the Android app (.apk) and the Windows installer (.exe) and publishes them in GitHub Releases.
# Runs when a version tag is pushed (v13.5.0) or by hand from the Actions tab.
# The Android signing key is never in the repository: it comes from encrypted repository secrets.
name: Release apps
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version: { description: 'Version (e.g. 13.5.0)', required: true }
permissions:
  contents: write
env:
  VERSION: ${{ github.event.inputs.version || github.ref_name }}
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.10.2' }
      - name: Build signed APK
        working-directory: apps/android
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          V="${VERSION#v}"
          export VERSION_NAME="$V" VERSION_CODE="${{ github.run_number }}"
          if [ -n "$KEYSTORE_B64" ]; then echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.p12"; export ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/release.p12"; fi
          gradle --no-daemon assembleRelease
          mkdir -p out && cp app/build/outputs/apk/release/*.apk "out/Nebulix-$V.apk"
          rm -f "$RUNNER_TEMP/release.p12"
      - uses: actions/upload-artifact@v4
        with: { name: android, path: apps/android/out/*.apk }
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: '22' }
      - name: Build installer
        working-directory: apps/windows
        shell: bash
        run: |
          V="${VERSION#v}"
          npm ci --no-audit --no-fund
          npm version "$V" --no-git-tag-version --allow-same-version
          npm run dist
      - uses: actions/upload-artifact@v4
        with: { name: windows, path: apps/windows/dist/*.exe }
  release:
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - name: SHA-256 checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version && format('v{0}', github.event.inputs.version) || github.ref_name }}
          name: Nebulix ${{ env.VERSION }}
          files: dist/*
          generate_release_notes: true
